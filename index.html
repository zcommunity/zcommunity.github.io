<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z COMMUNITY</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-purple: #a855f7;
            --accent-glow: #c084fc;
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .logo {
            width: 140px;
            height: 140px;
            border-radius: 24px;
            object-fit: cover;
            border: 2px solid var(--accent-purple);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.8), 0 0 50px rgba(168, 85, 247, 0.4);
        }

        header h1 {
            color: var(--text-color);
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.9), 0 0 30px rgba(168, 85, 247, 0.5);
        }

        .social-bar {
            margin-top: 10px;
        }

        .btn-discord {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: var(--accent-purple);
            color: #ffffff;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.15rem;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.7);
            transition: all 0.3s ease;
        }

        .btn-discord:hover, .btn-discord:active {
            background-color: var(--accent-glow);
            box-shadow: 0 0 35px rgba(192, 132, 252, 1);
            transform: translateY(-3px);
        }

        .discord-icon {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }

        footer {
            margin-top: 70px;
            font-size: 0.85rem;
            color: #444;
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png?v=1" alt="Z Community Logo" class="logo">
        </div>
        <h1>Z COMMUNITY</h1>
    </header>

    <div class="social-bar">
        <a href="https://discord.gg/Qf5YpZyzAb" target="_blank" class="btn-discord">
