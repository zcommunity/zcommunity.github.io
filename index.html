<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z COMMUNITY</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #a855f7;
            --accent-hover: #9333ea;
            --text-color: #c5c6c7;
            --title-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        header h1 {
            color: var(--title-color);
            font-size: 2.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .social-bar {
            margin-top: 10px;
        }

        .btn-discord {
            display: inline-block;
            background-color: var(--accent-color);
            color: #fff;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .btn-discord:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 60px;
            font-size: 0.8rem;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Z Community Logo" class="logo">
        <h1>Z COMMUNITY</h1>
    </header>

    <div class="social-bar">
        <a href="https://discord.gg/Qf5YpZyzAb" target="_blank" class="btn-discord">Unirse al Discord</a>
    </div>

    <footer>
        <p>&copy; Z COMMUNITY</p>
    </footer>

</body>
</html>
