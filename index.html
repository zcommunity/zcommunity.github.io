<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z COMMUNITY</title>
    <style>
        :root {
            --accent-purple: #9333ea;
            --accent-glow: #a855f7;
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000000;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Canvas para las partículas moradas */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            z-index: 2;
        }

        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .logo {
            width: 140px;
            height: 140px;
            border-radius: 28px;
            object-fit: cover;
            border: 2px solid var(--accent-glow);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.7), 0 0 60px rgba(147, 51, 234, 0.4);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        header h1 {
            color: var(--text-color);
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.9), 0 0 30px rgba(147, 51, 234, 0.6);
        }

        .social-bar {
            margin-top: 10px;
            z-index: 2;
        }

        .btn-discord {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: var(--accent-purple);
            color: #ffffff;
            padding: 16px 32px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.15rem;
            box-shadow: 0 0 25px rgba(147, 51, 234, 0.8);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-discord:hover, .btn-discord:active {
            background-color: var(--accent-glow);
            box-shadow: 0 0 40px rgba(168, 85, 247, 1);
            transform: translateY(-3px);
        }

        .discord-icon {
            width: 28px;
            height: 28px;
            min-width: 28px;
            min-height: 28px;
            flex-shrink: 0;
            fill: #ffffff;
        }

        footer {
            margin-top: 70px;
            font-size: 0.85rem;
            color: #555;
            letter-spacing: 1px;
            text-align: center;
            z-index: 2;
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <header>
        <div class="logo-container">
            <img src="logo.png?v=1" alt="Z Community Logo" class="logo">
        </div>
        <h1>Z COMMUNITY</h1>
    </header>

    <div class="social-bar">
        <a href="https://discord.gg/Qf5YpZyzAb" target="_blank" class="btn-discord">
            <svg class="discord-icon" viewBox="0 0 24 24">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            Unirse al Discord
        </a>
    </div>

    <footer>
        <p>&copy; Z COMMUNITY</p>
    </footer>

    <script>
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const particleCount = 65;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 0.5,
                color: `rgba(${168 + Math.random() * 40}, 85, 247, ${Math.random() * 0.7 + 0.3})`,
                speedX: (Math.random() - 0.5) * 0.4,
                speedY: (Math.random() - 0.5) * 0.4
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#a855f7';
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>

</body>
</html>
